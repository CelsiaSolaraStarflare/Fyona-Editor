<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fyona Canvas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="app">
        <header class="toolbar">
            <div class="toolbar__tabs" role="tablist" aria-label="Primary toolbar">
                <button type="button" class="toolbar__tab is-active" role="tab" aria-selected="true" data-target="toolbar-project">Project</button>
                <button type="button" class="toolbar__tab" role="tab" aria-selected="false" data-target="toolbar-canvas">Canvas</button>
                <button type="button" class="toolbar__tab" role="tab" aria-selected="false" data-target="toolbar-blocks">Blocks</button>
                <button type="button" class="toolbar__tab" role="tab" aria-selected="false" data-target="toolbar-export">Export</button>
            </div>
            <div class="toolbar__sections">
                <section id="toolbar-project" class="toolbar__section toolbar__section--active" role="tabpanel">
                    <div class="toolbar__group">
                        <label for="project-select">Project</label>
                        <select id="project-select"></select>
                        <button id="refresh-projects" class="btn btn--icon" title="Refresh projects">&#8635;</button>
                    </div>
                    <div class="toolbar__group">
                        <button id="save-layout" class="btn btn--primary">Save Layout</button>
                    </div>
                </section>
                <section id="toolbar-canvas" class="toolbar__section" role="tabpanel" hidden>
                    <div class="toolbar__group">
                        <label for="canvas-format">Canvas</label>
                        <select id="canvas-format">
                            <option value="A5">A5</option>
                            <option value="A4" selected>A4</option>
                            <option value="A3">A3</option>
                            <option value="Letter">Letter</option>
                        </select>
                        <button id="toggle-orientation" class="btn btn--icon" title="Toggle orientation">↺</button>
                        <span id="canvas-size-label" class="toolbar__hint"></span>
                    </div>
                    <div class="toolbar__group">
                        <label for="canvas-zoom">Zoom</label>
                        <div class="zoom-control">
                            <button id="zoom-out" class="btn btn--icon" type="button" aria-label="Zoom out">−</button>
                            <input id="canvas-zoom" type="range" min="0.5" max="5" step="0.1" value="1" aria-label="Canvas zoom">
                            <button id="zoom-in" class="btn btn--icon" type="button" aria-label="Zoom in">+</button>
                        </div>
                        <span id="zoom-label" class="toolbar__hint">100%</span>
                    </div>
                </section>
                <section id="toolbar-blocks" class="toolbar__section" role="tabpanel" hidden>
                    <div class="toolbar__group">
                        <button id="add-text" class="btn">Add Text</button>
                        <button id="add-image" class="btn">Add Image</button>
                    </div>
                </section>
                <section id="toolbar-export" class="toolbar__section" role="tabpanel" hidden>
                    <div class="toolbar__group">
                        <label for="export-format" class="toolbar__hint">Export as</label>
                        <select id="export-format" class="export-format">
                            <option value="pdf" selected>PDF</option>
                            <option value="png">PNG</option>
                            <option value="jpeg">JPEG</option>
                            <option value="docx">Word (DOCX)</option>
                            <option value="pptx">PowerPoint (PPTX)</option>
                        </select>
                        <button id="export-document" class="btn btn--secondary" type="button">Download</button>
                    </div>
                </section>
            </div>
        </header>

        <main class="workspace">
            <section class="pages-panel" aria-label="Pages">
                <div class="pages-panel__header">
                    <h2>Pages</h2>
                </div>
                <div id="pages-list" class="pages-panel__list" aria-label="Page list"></div>
                <p id="pages-empty" class="pages-panel__empty" hidden>No pages yet. Click a divider to add one.</p>
            </section>
            <section class="canvas-panel">
                <div class="canvas-wrapper">
                    <div class="canvas-stage">
                        <div id="canvas" class="canvas" aria-label="Canvas"></div>
                    </div>
                </div>
            </section>

            <aside class="inspector" aria-label="Inspector" id="inspector-panel">
                <div id="inspector-shell" class="inspector__shell">
                    <h2>Block Properties</h2>
                    <div id="inspector-empty" class="inspector__empty">
                        Select a block to edit its properties.
                    </div>
                    <form id="inspector-form" class="inspector__form" hidden>
                        <div class="field">
                            <label for="inspector-type">Type</label>
                            <input id="inspector-type" type="text" readonly>
                        </div>
                        <div class="field">
                            <label for="inspector-content">Content</label>
                            <textarea id="inspector-content" rows="3"></textarea>
                        </div>
                        <div class="field" id="text-style-options" hidden>
                            <label for="inspector-font">Font</label>
                            <select id="inspector-font"></select>
                        </div>
                        <div class="field" id="font-size-field" hidden>
                            <label for="inspector-font-size">Font Size (px)</label>
                            <input id="inspector-font-size" type="number" min="8" max="200" value="16">
                        </div>
                        <div class="field" id="image-options" hidden>
                            <label>Image Tools</label>
                            <button type="button" id="upload-image" class="btn btn--secondary">Upload Image</button>
                        </div>
                        <div class="field field--row">
                            <div>
                                <label for="inspector-left">X</label>
                                <input id="inspector-left" type="number">
                            </div>
                            <div>
                                <label for="inspector-top">Y</label>
                                <input id="inspector-top" type="number">
                            </div>
                        </div>
                        <div class="field field--row">
                            <div>
                                <label for="inspector-width">Width</label>
                                <input id="inspector-width" type="number">
                            </div>
                            <div>
                                <label for="inspector-height">Height</label>
                                <input id="inspector-height" type="number">
                            </div>
                        </div>
                        <div class="field field--row">
                            <div>
                                <label for="inspector-bg">Background</label>
                                <input id="inspector-bg" type="color" value="#ffffff">
                            </div>
                            <div>
                                <label for="inspector-fg">Text</label>
                                <input id="inspector-fg" type="color" value="#000000">
                            </div>
                        </div>
                        <div class="field">
                            <label for="inspector-radius">Border Radius</label>
                            <input id="inspector-radius" type="number" min="0" max="120" value="12">
                        </div>
                        <div class="field" id="margin-field">
                            <label>Margins (px)</label>
                            <div class="field--row">
                                <div>
                                    <label for="inspector-margin-top">Top</label>
                                    <input id="inspector-margin-top" type="number" min="0" max="480" value="16">
                                </div>
                                <div>
                                    <label for="inspector-margin-right">Right</label>
                                    <input id="inspector-margin-right" type="number" min="0" max="480" value="16">
                                </div>
                            </div>
                            <div class="field--row">
                                <div>
                                    <label for="inspector-margin-bottom">Bottom</label>
                                    <input id="inspector-margin-bottom" type="number" min="0" max="480" value="16">
                                </div>
                                <div>
                                    <label for="inspector-margin-left">Left</label>
                                    <input id="inspector-margin-left" type="number" min="0" max="480" value="16">
                                </div>
                            </div>
                        </div>
                        <div class="inspector__actions">
                            <button type="button" id="delete-block" class="btn btn--danger">Delete Block</button>
                        </div>
                    </form>
                </div>
            </aside>
        </main>
    </div>

    <input type="file" id="image-upload" accept="image/*" hidden>

    <template id="toast-template">
        <div class="toast">
            <span class="toast__message"></span>
        </div>
    </template>

    <div class="chat-assistant" id="chat-root">
        <button type="button" id="chat-launcher" class="chat-launcher" aria-haspopup="dialog" aria-controls="chat-panel" aria-expanded="false">
            <span class="chat-launcher__icon">💬</span>
            <span class="chat-launcher__label">Ask Fyona</span>
        </button>
        <section class="chat-panel" id="chat-panel" aria-hidden="true">
            <button type="button" class="chat-panel__resize-handle" id="chat-resize-handle" aria-label="Resize assistant panel">
                <svg viewBox="0 0 44 20" role="presentation" aria-hidden="true" focusable="false">
                    <path d="M3 17 C12 4, 32 4, 41 17" />
                </svg>
            </button>
            <header class="chat-panel__header">
                <div>
                    <p class="chat-panel__title">Fyona Assistant</p>
                    <p class="chat-panel__subtitle" id="chat-status">Assistant ready</p>
                </div>
                <div class="chat-panel__header-actions">
                    <button type="button" class="chat-agent-toggle" id="chat-agent-toggle">Agent Mode Off</button>
                    <button type="button" class="chat-close" id="chat-close" aria-label="Close assistant">×</button>
                </div>
            </header>
            <p class="chat-token-stats" id="chat-token-stats" aria-live="polite">Tokens: —</p>
            <div class="chat-agent-indicator" id="chat-agent-indicator" hidden>
                <strong>Agent Mode enabled</strong>
                <span id="chat-agent-permission-summary">The assistant can inspect your project files.</span>
                <label class="chat-agent-permission">
                    <input type="checkbox" id="chat-agent-allow-edits">
                    Allow layout edits
                </label>
            </div>
            <div class="chat-log" id="chat-log" role="log" aria-live="polite"></div>
            <div class="chat-panel__attachments" id="chat-attachments" hidden></div>
            <div class="chat-panel__actions">
                <button type="button" class="btn btn--secondary" id="chat-attach-canvas">Attach current page as PNG</button>
            </div>
            <form class="chat-form" id="chat-form">
                <textarea id="chat-input" rows="2" placeholder="Ask Fyona anything…"></textarea>
                <button type="submit" class="btn btn--primary">Send</button>
            </form>
        </section>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
